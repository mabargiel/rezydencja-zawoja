schema: spec-driven

context: |
  Rezydencja Zawoja: marketing site for a guesthouse in Zawoja, Poland. Brochure site, no on-site booking.
  Monorepo (npm workspaces): app/ = Next.js 16 App Router, React 19, TypeScript 6, Tailwind 4;
  cms/ = Sanity Studio 6 (project oavmm529, dataset production); design/rezydencja.pen = pen.dev design,
  read only through the Pencil MCP. Hosting: Vercel (root dir app/), Studio on rezydencja-zawoja.sanity.studio.
  i18n: PL/EN/DE with i18next, URL prefix /pl /en /de, Accept-Language detection, EN fallback.
  Content split: images, videos and pricing in Sanity; page copy and UI text in i18next catalogs.
  Conventions: Conventional Commits with scopes app|cms|design|ci|repo; Server Components by default;
  no AI-style comments; see CLAUDE.md for the full rules.

rules:
  tasks:
    - Each task is small enough to finish and verify in one sitting
    - UI tasks name the design node IDs they implement
    - Every task that changes UI text covers all three languages
  design:
    - Reference design node IDs from design/rezydencja.pen for any UI decision
